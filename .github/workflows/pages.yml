name: Ověření a publikace radaru

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4
      - name: Nastavit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Ověřit JSON a povinná pole
        run: node scripts/validate-data.mjs
      - name: Ověřit přítomnost webu
        run: test -f index.html && test -f assets/app.js && test -f assets/styles.css
      - name: Připravit GitHub Pages
        uses: actions/configure-pages@v5
      - name: Zabalit web
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Publikovat
        id: deployment
        uses: actions/deploy-pages@v4
